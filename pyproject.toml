[project]
name = "athena"
version = "0.1.0"
description = "JasMehr's MBA study tutor, grounded only in his professors' slides."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:fitz.*",
    "ignore::DeprecationWarning:pymupdf.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
